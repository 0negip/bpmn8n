[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpmn8n"
version = "0.1.0"
description = "BPMN on n8n: Django tasks as n8n nodes, checked workflows, LLM-assisted design (Studio), process mining (PM4Py)"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = ["Django>=4.2", "django-ninja>=1.4", "pydantic>=2", "pm4py>=2.7", "scikit-learn>=1.5", "markdown>=3.6"]
optional-dependencies = {anthropic = ["anthropic>=1.17"]}

[tool.setuptools.packages.find]
include = ["bpmn8n*"]

[tool.setuptools.package-data]
bpmn8n = ["templates/**/*", "static/**/*"]
